<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Daily habits, kept. A calm streak calendar." />
    <meta name="theme-color" content="#f3f0e8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400..700;1,400..700&family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&display=swap"
    />
    <title>Cadence</title>
    <script>
      try {
        const storedTheme = localStorage.getItem("cadence-theme");
        const isDark =
          storedTheme === "dark" ||
          (storedTheme !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) document.documentElement.classList.add("dark");
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", isDark ? "#12110e" : "#f3f0e8");
      } catch {
        // ThemeSync applies the system preference if local storage is unavailable.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
